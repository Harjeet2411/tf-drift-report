[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tf-drift-report"
version = "0.1.0"
description = "Turn Terraform plan JSON into a readable drift report for pull request comments, and fail CI on drift or destruction"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Harjeet J L" }]
keywords = ["terraform", "drift", "iac", "devops", "ci", "pull-request"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Console",
]

[project.scripts]
tf-drift-report = "tf_drift_report.cli:main"

[tool.setuptools]
packages = ["tf_drift_report"]
