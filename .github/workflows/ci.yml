name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Install and run on the example plan
        run: |
          pip install .
          tf-drift-report examples/plan.json
          tf-drift-report examples/plan.json --format markdown > /dev/null
          # The example has drift and a destroy, so these must fail with exit code 2
          if tf-drift-report examples/plan.json --fail-on drift,destroy > /dev/null 2>&1; then exit 1; fi
